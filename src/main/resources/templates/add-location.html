<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Add Location</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/e59232f0a1.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 mb-4">
    <div sec:authorize="hasRole('ROLE_ADMIN')" class="d-flex w-100 justify-content-between align-items-center">
        <span class="me-5 fw-bold text-dark" style="margin-right: 400px; font-weight: bold">Event Manager</span>
        <a class="btn btn-outline-danger" href="/logout">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</nav>

<div class="d-flex justify-content-center">
    <div class="w-100 px-3" style="max-width: 700px;">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="fas fa-map-marker-alt me-2"></i>
                    Add Location
                </h5>
            </div>

            <div class="card-body">
                <form action="/locations/add" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">Location Name</label>
                        <input type="text" class="form-control" id="name" name="name"
                               th:value="(${location} != null ? ${location.getName()} : '')"
                               required placeholder="Enter location name">
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" name="address"
                               th:value="(${location} != null ? ${location.getAddress()} : '')"
                               required placeholder="Enter address">
                    </div>

                    <div class="mb-3">
                        <label for="capacity" class="form-label">Capacity</label>
                        <input type="number" class="form-control" id="capacity" name="capacity" min="1"
                               th:value="(${location} != null ? ${location.getCapacity} : '')"
                               required placeholder="Enter capacity">
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" name="description"
                               th:value="(${location} != null ? ${location.getDescription()} : '')"
                               required placeholder="Short description...">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a class="btn btn-secondary" href="/locations">
                            <i class="fas fa-arrow-left"></i> Back
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-check"></i> Submit
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

</body>
</html>
