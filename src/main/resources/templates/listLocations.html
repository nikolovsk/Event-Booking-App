<th:block xmlns:th="http://www.thymeleaf.org">
    <main class="container my-5">
        <h2 class="text-center mb-4">All Locations</h2>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="location : ${locations}">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="card-title text-primary fw-bold">
                                <i class="fas fa-map-marker-alt me-2 text-danger"></i>
                                <span th:text="${location.getName()}"></span>
                            </h5>
                            <p class="card-text">
                                <strong>Address:</strong> <span th:text="${location.getAddress()}"></span><br>
                                <strong>Capacity:</strong> <span th:text="${location.getCapacity}"></span><br>
                                <strong>Description:</strong> <span th:text="${location.getDescription()}"></span>
                            </p>
                        </div>
                        <br>

                        <div class="mt-auto">
                            <form th:action="@{'/locations/delete/{id}' (id=${location.getId()})}" th:method="DELETE" class="mt-2">
                                <button type="submit" class="btn btn-sm btn-danger w-50">
                                    <i class="fas fa-trash-alt me-1"></i> Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/locations/add-form" class="btn btn-dark px-4 py-2">
                <i class="fas fa-plus me-2"></i> Add New Location
            </a>
        </div>
    </main>
</th:block>
