<th:block xmlns:th="http://www.thymeleaf.org">
    <main class="container my-5">
        <section class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg rounded-4">
                    <div class="card-header bg-dark text-white text-center rounded-top-4">
                        <h2 class="mb-0">Booking Confirmation</h2>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered table-hover">
                            <thead class="table-light">
                            <tr>
                                <th colspan="2" class="text-center">Your Booking Status</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td><i class="bi bi-person-fill me-2 text-secondary"></i><b>Attendee Name</b></td>
                                <td th:text="${hostName} ?: 'Petko Petkov'"></td>
                            </tr>
                            <tr>
                                <td><i class="bi bi-globe me-2 text-secondary"></i><b>Client IP Address</b></td>
                                <td th:text="${clientIp} ?: '127.0.0.1'"></td>
                            </tr>
                            <tr>
                                <td><i class="bi bi-calendar-event me-2 text-secondary"></i><b>Booking for Event</b></td>
                                <td th:text="${eventName} ?: 'Oppenheimer'"></td>
                            </tr>
                            <tr>
                                <td><i class="bi bi-calendar-check me-2 text-secondary"></i><b>Date</b></td>
                                <td th:text="${date} ?: '01/01/2025'"></td>
                            </tr>
                            <tr>
                                <td><i class="bi bi-geo-alt me-2 text-secondary"></i><b>Event Location</b></td>
                                <td th:text="${location} ?: 'Location 1'"></td>
                            </tr>
                            <tr>
                                <td><i class="bi bi-ticket-detailed me-2 text-secondary"></i><b>Number of Tickets</b></td>
                                <td th:text="${numTickets} ?: '2'"></td>
                            </tr>
                            </tbody>
                        </table>
                        <div class="text-center mt-4">
                            <a class="btn btn-outline-primary px-4" href="/events">
                                <i class="bi bi-arrow-left me-1"></i> Back to Events
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</th:block>
