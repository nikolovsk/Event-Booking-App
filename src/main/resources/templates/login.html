<th:block xmlns:th="http://www.thymeleaf.org">
    <div class="container mt-5 d-flex justify-content-center">
        <div class="card shadow-lg p-4 rounded-4" style="max-width: 400px; width: 100%;">
            <h4 class="text-center mb-4">Login</h4>
            <form th:method="POST" th:action="@{/login}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" type="password" name="password" class="form-control" required>
                </div>

                <div th:if="${param.error}" class="alert alert-danger p-2" role="alert" th:text="${param.error}"></div>

                <div class="d-flex justify-content-center mb-2">
                    <button type="submit" class="btn btn-primary">Log In</button>
                </div>
            </form>
            <div class="text-center">
                <a href="/register" class="text-decoration-none">Don't have an account? Register here</a>
            </div>
        </div>
    </div>
</th:block>
